<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金鶯診所 ・ 初診資料登錄</title>
<style>
  :root{
    --teal-deep:#1f6f7a;
    --teal:#3a9aa6;
    --teal-light:#7cc4c4;
    --mint:#cfeae0;
    --mint-soft:#e6f4ec;
    --leaf:#9cc9a0;
    --bg-top:#dff3ec;
    --bg-bot:#eef8f1;
    --text:#2b4a4d;
    --error:#d2604a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
    color:var(--text);
    background:linear-gradient(160deg,var(--bg-top) 0%,var(--bg-bot) 60%,#ffffff 100%);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  /* 背景柔和葉影 */
  .bg-leaves{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none;}
  .bg-leaves span{position:absolute;border-radius:60% 0 60% 0;opacity:.25;}
  .l1{width:220px;height:220px;background:var(--leaf);left:-60px;bottom:-40px;transform:rotate(20deg);opacity:.18;}
  .l2{width:160px;height:160px;background:var(--teal-light);right:-40px;top:80px;transform:rotate(-15deg);opacity:.15;}
  .l3{width:120px;height:120px;background:var(--mint);right:30px;bottom:40px;opacity:.4;}

  .wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:32px 18px 60px;}

  /* 封面 / LOGO 區 */
  .cover{text-align:center;padding:18px 0 8px;}
  .cover-logo{width:170px;height:170px;object-fit:contain;filter:drop-shadow(0 6px 14px rgba(31,111,122,.15));}
  .cover h1{margin:14px 0 2px;font-size:24px;font-weight:700;color:var(--teal-deep);letter-spacing:1px;}
  .cover .sub{margin:0;font-size:14px;color:var(--teal);letter-spacing:2px;}

  /* 表單卡片 */
  .card{
    background:rgba(255,255,255,.86);
    backdrop-filter:blur(4px);
    border:1px solid rgba(124,196,196,.4);
    border-radius:20px;
    padding:26px 22px 28px;
    margin-top:22px;
    box-shadow:0 12px 32px rgba(31,111,122,.10);
  }
  .field{margin-bottom:18px;}
  label{display:block;font-size:14.5px;font-weight:600;margin-bottom:7px;color:var(--teal-deep);}
  label .req{color:var(--error);margin-left:3px;}
  input,select,textarea{
    width:100%;padding:12px 14px;font-size:15px;color:var(--text);
    border:1.5px solid #cfe3e0;border-radius:12px;background:#fbfffd;
    font-family:inherit;transition:border-color .15s,box-shadow .15s;
  }
  input:focus,select:focus,textarea:focus{
    outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(58,154,166,.15);
  }
  textarea{resize:vertical;min-height:64px;}
  .hint{font-size:12.5px;color:#7a9b97;margin-top:5px;}
  .err-msg{display:none;font-size:12.5px;color:var(--error);margin-top:5px;}
  .field.invalid input,.field.invalid select{border-color:var(--error);}
  .field.invalid .err-msg{display:block;}

  button.submit{
    width:100%;margin-top:6px;padding:14px;font-size:16px;font-weight:700;letter-spacing:1px;
    color:#fff;background:linear-gradient(135deg,var(--teal) 0%,var(--teal-deep) 100%);
    border:none;border-radius:14px;cursor:pointer;transition:transform .1s,box-shadow .2s,opacity .2s;
    box-shadow:0 8px 18px rgba(31,111,122,.25);
  }
  button.submit:hover{box-shadow:0 10px 22px rgba(31,111,122,.32);}
  button.submit:active{transform:translateY(1px);}
  button.submit:disabled{opacity:.6;cursor:not-allowed;}

  .footer{text-align:center;font-size:12px;color:#8aa9a4;margin-top:24px;}

  /* 成功畫面 */
  .done{display:none;text-align:center;padding:40px 16px;}
  .done .check{width:78px;height:78px;margin:0 auto 18px;border-radius:50%;
    background:linear-gradient(135deg,var(--teal-light),var(--teal));
    display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(58,154,166,.3);}
  .done .check svg{width:40px;height:40px;}
  .done h2{color:var(--teal-deep);margin:0 0 8px;font-size:22px;}
  .done p{color:#5d827e;margin:0 0 22px;font-size:15px;}
  .done button{padding:12px 28px;font-size:15px;font-weight:600;color:var(--teal-deep);
    background:#fff;border:1.5px solid var(--teal);border-radius:12px;cursor:pointer;}

  /* 歡迎說明 */
  .intro{background:rgba(255,255,255,.78);border:1px solid rgba(124,196,196,.4);
    border-radius:18px;padding:20px 20px 18px;margin-top:18px;
    box-shadow:0 8px 22px rgba(31,111,122,.08);}
  .intro{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;}
  .intro .hi{font-size:16px;font-weight:600;color:var(--teal);margin:0 0 10px;letter-spacing:.5px;}
  .intro p{margin:0 0 11px;font-size:14px;line-height:1.95;letter-spacing:.4px;color:#5a7d79;font-weight:400;}
  .intro p:last-child{margin-bottom:0;}
  .intro b{color:var(--teal-deep);font-weight:600;}
  .intro .links{margin-top:12px;padding-top:14px;border-top:1px dashed rgba(58,154,166,.35);
    display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .intro .links a{display:flex;align-items:center;gap:8px;text-decoration:none;
    color:var(--teal-deep);font-size:13px;font-weight:600;
    padding:10px 11px;border:1px solid rgba(124,196,196,.45);border-radius:12px;
    background:var(--mint-soft);transition:border-color .15s,box-shadow .15s;}
  .intro .links a:hover{border-color:var(--teal);box-shadow:0 4px 12px rgba(31,111,122,.12);}
  .intro .links .ico{flex:0 0 28px;width:28px;height:28px;border-radius:8px;
    background:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;}
  .intro .links small{display:block;font-weight:400;color:#7a9b97;font-size:11.5px;margin-top:1px;}
  @media(max-width:380px){.intro .links{gap:7px;}.intro .links a{padding:9px 8px;font-size:12px;}.intro .links small{font-size:11px;}}
</style>
</head>
